<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alpha Trade Oracle Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dash.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div class="desk-bg" aria-hidden="true"></div>
    <aside class="rail">
      <div class="rail-brand">
        <span class="rail-brand-mark">Alpha Trade Oracle Bot</span>
        <span class="rail-brand-live" id="feedPulse">LIVE</span>
      </div>
      <div class="rail-meta">
        <span>Top 300</span>
        <span>60s Feed</span>
        <span id="clock">--:--:--</span>
      </div>
      <div class="filters">
        <button type="button" class="f active" data-f="all">Alle</button>
        <button type="button" class="f" data-f="long">Long</button>
        <button type="button" class="f" data-f="short">Short</button>
        <button type="button" class="f" data-f="open">Open</button>
      </div>
      <div class="list" id="list"></div>
    </aside>

    <main class="stage" id="stage">
      <p class="hint">Signal wählen · Chart lädt Live-Kerzen</p>
    </main>

    <script src="data.js"></script>
    <script src="dash-chart.js"></script>
    <script src="dash.js"></script>
  </body>
</html>
