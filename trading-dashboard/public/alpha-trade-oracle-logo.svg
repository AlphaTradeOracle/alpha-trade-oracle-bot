<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-label="Alpha Trade Oracle">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6E27A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C00"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C547"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#132A3F"/>
      <stop offset="100%" stop-color="#070E18"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="560" fill="#070E18"/>
  <rect width="512" height="560" fill="url(#bgGlow)"/>

  <!-- Outer gold hexagon only (no grey inner border) -->
  <polygon
    points="256,42 430,142 430,342 256,442 82,342 82,142"
    fill="none"
    stroke="url(#gold)"
    stroke-width="14"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <!-- Stylized A -->
  <path
    d="M256 118
       L348 360
       H308
       L290 308
       H222
       L204 360
       H164
       Z
       M236 250
       H276
       L256 190
       Z"
    fill="url(#gold)"
    filter="url(#softShadow)"
  />

  <!-- Eye of Providence -->
  <g transform="translate(256 168)" fill="none" stroke="url(#goldSoft)" stroke-width="2.2">
    <!-- Rays -->
    <line x1="0" y1="-28" x2="0" y2="-38"/>
    <line x1="-10" y1="-26" x2="-14" y2="-35"/>
    <line x1="10" y1="-26" x2="14" y2="-35"/>
    <line x1="-18" y1="-20" x2="-26" y2="-26"/>
    <line x1="18" y1="-20" x2="26" y2="-26"/>
    <!-- Eye outline -->
    <path d="M-22 0 Q0 -14 22 0 Q0 14 -22 0 Z" fill="#0B1520" stroke="url(#gold)"/>
    <circle cx="0" cy="0" r="5.5" fill="url(#gold)" stroke="none"/>
  </g>

  <!-- Candlesticks under the eye / inside A -->
  <g transform="translate(256 278)">
    <!-- Outer grey -->
    <g fill="#8B93A7">
      <rect x="-58" y="-6" width="8" height="28" rx="1"/>
      <line x1="-54" y1="-14" x2="-54" y2="28" stroke="#8B93A7" stroke-width="1.5"/>
      <rect x="50" y="-2" width="8" height="24" rx="1"/>
      <line x1="54" y1="-10" x2="54" y2="28" stroke="#8B93A7" stroke-width="1.5"/>
    </g>
    <!-- Inner grey -->
    <g fill="#9AA3B5">
      <rect x="-34" y="-12" width="10" height="34" rx="1"/>
      <line x1="-29" y1="-20" x2="-29" y2="28" stroke="#9AA3B5" stroke-width="1.6"/>
      <rect x="24" y="-8" width="10" height="30" rx="1"/>
      <line x1="29" y1="-16" x2="29" y2="28" stroke="#9AA3B5" stroke-width="1.6"/>
    </g>
    <!-- Center gold -->
    <g fill="url(#gold)">
      <rect x="-8" y="-22" width="16" height="44" rx="1.5"/>
      <line x1="0" y1="-34" x2="0" y2="30" stroke="url(#gold)" stroke-width="2"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text
    x="256" y="492"
    text-anchor="middle"
    fill="url(#gold)"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="22"
    letter-spacing="8"
    font-weight="600"
  >ALPHA TRADE</text>

  <line x1="118" y1="522" x2="188" y2="522" stroke="#6B7280" stroke-width="1.5"/>
  <text
    x="256" y="530"
    text-anchor="middle"
    fill="url(#gold)"
    font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="28"
    letter-spacing="6"
    font-weight="700"
  >ORACLE</text>
  <line x1="324" y1="522" x2="394" y2="522" stroke="#6B7280" stroke-width="1.5"/>
</svg>
